name: Integrate Budget Resubmission

on:
  push:
    branches:
      - finance-budget-resubmit
    paths:
      - .github/workflows/budget_resubmit_integrate.yml
      - tools/apply_budget_resubmit.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/malenge_budget_resubmit_ci.db
      SECRET_KEY: budget-resubmit-ci-secret-not-for-production
      APP_ENV: development
      TWO_FACTOR_REQUIRED: "false"
      ALLOW_BOOTSTRAP_REGISTRATION: "true"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: finance-budget-resubmit
          fetch-depth: 0

      - name: Apply budget correction and resubmission patch
        run: python tools/apply_budget_resubmit.py

      - name: Check Python syntax
        run: python -m py_compile phase7.py phase7_regression_tests.py tools/apply_budget_resubmit.py

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Phase 7 regression tests
        run: python phase7_regression_tests.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase7.py templates/phase7/finance_control.html phase7_regression_tests.py
          git commit -m "Add budget correction and resubmission workflow [skip ci]"
          git pull --rebase origin finance-budget-resubmit
          git push origin HEAD:finance-budget-resubmit
