name: Membership payment approval notifications

on:
  push:
    branches:
      - fix/membership-payment-notifications
    paths:
      - app.py
      - membership_regression_tests.py
      - .github/workflows/membership_payment_notifications.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run membership regression tests
        env:
          APP_ENV: development
          SECRET_KEY: test-workflow-secret
          TWO_FACTOR_REQUIRED: 'false'
        run: python membership_regression_tests.py
