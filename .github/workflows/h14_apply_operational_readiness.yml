name: Apply H14 Operational Readiness Registration

on:
  push:
    branches:
      - crm-hardening-14-operational-readiness
    paths:
      - tools/apply_h14_operational_readiness.py
      - .github/workflows/h14_apply_operational_readiness.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-14-operational-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register operational readiness probes
        run: python tools/apply_h14_operational_readiness.py
      - name: Commit generated application registration
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Register operational readiness probes"
          git push origin HEAD:crm-hardening-14-operational-readiness
