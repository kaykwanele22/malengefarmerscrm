name: Apply H12 Error Feedback Hardening

on:
  push:
    branches:
      - crm-hardening-12-error-feedback
    paths:
      - tools/apply_error_feedback_hardening.py
      - .github/workflows/h12_apply_error_feedback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-12-error-feedback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: python tools/apply_error_feedback_hardening.py
      - name: Commit generated hardening
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Harden error handling and API feedback"
          git push origin HEAD:crm-hardening-12-error-feedback
