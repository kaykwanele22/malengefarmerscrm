name: Joint Operations Integration

on:
  push:
    branches:
      - joint-operations-suite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joint-operations-suite
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration edits
        run: |
          python tools/apply_joint_operations_integration.py
          python tools/update_joint_operations_permission_tests.py
      - name: Commit integration edits when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py phase7.py templates/base.html templates/dashboard.html templates/phase7/finance_control.html templates/joint_operations/dashboard.html run_regression_tests.py joint_operations_regression_tests.py permission_regression_tests.py
            git commit -m "Integrate MFPSU joint operations"
            git push origin HEAD:joint-operations-suite
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python run_regression_tests.py
