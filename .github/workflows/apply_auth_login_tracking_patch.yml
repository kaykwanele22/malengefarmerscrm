name: Apply Auth Login Tracking Patch

on:
  push:
    branches:
      - crm-hardening-10-auth-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-10-auth-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply login tracking patch
        run: python tools/apply_auth_login_tracking_patch.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- auth_hardening.py auth_hardening_regression_tests.py; then
            echo "No login tracking patch change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth_hardening.py auth_hardening_regression_tests.py
          git commit -m "Track successful login on first authenticated request"
          git push origin HEAD:crm-hardening-10-auth-lifecycle
