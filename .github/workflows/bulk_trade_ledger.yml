name: Secondary bulk trade and account ledger

on:
  push:
    branches: [feature/secondary-bulk-trade]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m py_compile app.py phase7.py joint_operations.py bulk_trade.py account_ledger.py
      - name: Run existing regression suites
        env:
          APP_ENV: development
          SECRET_KEY: bulk-trade-test-secret
          TWO_FACTOR_REQUIRED: 'false'
        run: |
          python joint_operations_regression_tests.py
          python phase7_regression_tests.py
          python membership_regression_tests.py
