name: Actionable Options Integration

on:
  push:
    branches:
      - hide-completed-action-options
    paths:
      - tools/apply_actionable_option_filtering.py
      - actionable_options_regression_tests.py
      - run_regression_tests.py
      - .github/workflows/actionable_options_integrate.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hide-completed-action-options
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply actionable-option filtering
        run: python tools/apply_actionable_option_filtering.py
      - name: Compile source
        run: python -m compileall -q app.py joint_operations.py primary_production.py
      - name: Focused actionable-option tests
        run: python actionable_options_regression_tests.py
      - name: Full regression suite
        run: python run_regression_tests.py
      - name: Whitespace check
        run: git diff --check
      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "Kwanele Nduku"
          git config user.email "kaykwanele226@gmail.com"
          git add app.py joint_operations.py primary_production.py templates/contribution_form.html templates/joint_operations/dashboard.html templates/primary_production/dashboard.html run_regression_tests.py
          git commit -m "Hide completed records from action lists"
          git push origin HEAD:hide-completed-action-options
