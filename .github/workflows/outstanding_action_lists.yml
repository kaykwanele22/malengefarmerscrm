name: Outstanding Action Lists Integration

on:
  push:
    branches:
      - outstanding-action-lists
    paths:
      - tools/apply_outstanding_action_lists.py
      - tools/fix_outstanding_action_tests.py
      - outstanding_action_regression_tests.py
      - app.py
      - joint_operations.py
      - primary_production.py
      - templates/contribution_form.html
      - templates/payment_form.html
      - templates/primary_production/**
      - templates/joint_operations/**
      - run_regression_tests.py
      - .github/workflows/outstanding_action_lists.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: outstanding-action-lists
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply integration
        run: python tools/apply_outstanding_action_lists.py
      - name: Align validation redirect tests
        run: python tools/fix_outstanding_action_tests.py
      - name: Compile source
        run: python -m compileall -q app.py joint_operations.py primary_production.py outstanding_action_regression_tests.py
      - name: Focused outstanding action tests
        run: python outstanding_action_regression_tests.py
      - name: Full regression suite
        run: python run_regression_tests.py
      - name: Whitespace check
        run: git diff --check
      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "Kwanele Nduku"
          git config user.email "kaykwanele226@gmail.com"
          git add app.py joint_operations.py primary_production.py templates/contribution_form.html templates/payment_form.html templates/primary_production/dashboard.html templates/joint_operations/dashboard.html run_regression_tests.py outstanding_action_regression_tests.py
          git commit -m "Apply outstanding-only action lists"
          git push origin HEAD:outstanding-action-lists
