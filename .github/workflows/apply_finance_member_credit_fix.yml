name: Apply finance member credit fix

on:
  push:
    branches:
      - fix/finance-member-credit-ledger
    paths:
      - tools/apply_finance_member_credit_fix.py
      - .github/workflows/apply_finance_member_credit_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/finance-member-credit-ledger
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply finance patch
        run: python tools/apply_finance_member_credit_fix.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run membership regression tests
        env:
          APP_ENV: development
          SECRET_KEY: test-workflow-secret
          TWO_FACTOR_REQUIRED: 'false'
        run: python membership_regression_tests.py

      - name: Run Phase 7 regression tests
        env:
          APP_ENV: development
          SECRET_KEY: test-workflow-secret
          TWO_FACTOR_REQUIRED: 'false'
        run: python phase7_regression_tests.py

      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py phase7.py templates/contribution_form.html templates/memberships.html templates/phase7/finance_control.html membership_regression_tests.py
          git commit -m "Fix member credits and finance control ledger"
          git push origin HEAD:fix/finance-member-credit-ledger
