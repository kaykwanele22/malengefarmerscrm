name: Apply H13 Security Controls

on:
  push:
    branches:
      - crm-hardening-13-security-controls
    paths:
      - tools/apply_h13_security_controls.py
      - .github/workflows/h13_apply_security_controls.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-13-security-controls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic security controls patch
        run: python tools/apply_h13_security_controls.py
      - name: Commit generated security controls
        run: |
          if git diff --quiet -- auth_hardening.py auth_hardening_regression_tests.py .env.example; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth_hardening.py auth_hardening_regression_tests.py .env.example
          git commit -m "Harden authenticated session controls"
          git push origin HEAD:crm-hardening-13-security-controls
