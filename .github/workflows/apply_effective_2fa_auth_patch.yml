name: Apply Effective 2FA Auth Patch

on:
  push:
    branches:
      - crm-hardening-10-auth-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-10-auth-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align auth hardening with effective 2FA requirement
        run: python tools/apply_effective_2fa_auth_patch.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- auth_hardening.py; then
            echo "No effective-2FA patch change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth_hardening.py
          git commit -m "Use effective 2FA gate for auth lifecycle controls"
          git push origin HEAD:crm-hardening-10-auth-lifecycle
