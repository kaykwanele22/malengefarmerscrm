name: Integrate Phase 7

on:
  push:
    branches:
      - phase7-cooperative-operations-suite
    paths:
      - .github/workflows/phase7_integrate.yml
      - tools/apply_phase7_integration.py
      - tools/harden_phase7.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/malenge_phase7_ci.db
      SECRET_KEY: phase7-ci-secret-key-not-for-production
      APP_ENV: development
      TWO_FACTOR_REQUIRED: "false"
      ALLOW_BOOTSTRAP_REGISTRATION: "true"
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: phase7-cooperative-operations-suite
          fetch-depth: 0

      - name: Apply idempotent integration patch
        run: python tools/apply_phase7_integration.py

      - name: Apply Phase 7 hardening patch
        run: python tools/harden_phase7.py

      - name: Check Python syntax
        run: python -m py_compile app.py phase7.py upgrade_database.py tools/apply_phase7_integration.py tools/harden_phase7.py

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply full migration chain to fresh database
        run: python upgrade_database.py

      - name: Smoke-test Phase 7 registration and schema
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app import app, db
          required_tables = {
              "notification", "cooperative_document", "budget", "bank_reconciliation",
              "meeting_agenda_item", "meeting_attendance", "production_input",
              "equipment_usage", "api_access_token",
          }
          with app.app_context():
              tables = set(inspect(db.engine).get_table_names())
              missing = required_tables - tables
              if missing:
                  raise SystemExit("Missing Phase 7 tables: " + ", ".join(sorted(missing)))
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          required_routes = {
              "/work", "/notifications", "/documents", "/finance-control",
              "/production-control", "/reports/command-centre", "/search",
              "/api/tokens", "/api/v1/me", "/api/v1/accountability",
          }
          missing_routes = required_routes - rules
          if missing_routes:
              raise SystemExit("Missing Phase 7 routes: " + ", ".join(sorted(missing_routes)))
          print("Phase 7 schema and routes verified.")
          PY

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py phase7.py templates/base.html templates/meeting_detail.html templates/memberships.html upgrade_database.py
          git commit -m "Harden and validate Phase 7 operations suite [skip ci]"
          git push origin HEAD:phase7-cooperative-operations-suite
