name: Apply Auth Hardening Registration

on:
  push:
    branches:
      - crm-hardening-10-auth-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-10-auth-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register authentication hardening
        run: python tools/apply_auth_hardening_registration.py
      - name: Commit registration if needed
        run: |
          if git diff --quiet -- app.py; then
            echo "No registration change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Register authentication lifecycle hardening"
          git push origin HEAD:crm-hardening-10-auth-lifecycle
