name: Apply Auth Hardening Registration

on:
  push:
    branches:
      - crm-hardening-10-auth-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-hardening-10-auth-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply authentication hardening registration and UI refinements
        run: python tools/apply_auth_hardening_registration.py
      - name: Commit deterministic patch if needed
        run: |
          if git diff --quiet -- app.py templates/user_form.html templates/users.html; then
            echo "No auth hardening patch change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/user_form.html templates/users.html
          git commit -m "Polish authentication lifecycle administration UI"
          git push origin HEAD:crm-hardening-10-auth-lifecycle
