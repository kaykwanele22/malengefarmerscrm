name: CRM Regression Suite

on:
  push:
    branches:
      - main
      - crm-hardening-2026-09
      - crm-hardening-2-integrity
      - crm-hardening-3-reconciliation
      - crm-hardening-4-finance-unification
      - crm-hardening-5-opening-balance-integrity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build a fresh database from migrations
        env:
          SECRET_KEY: github-actions-migration-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
          DATABASE_URL: sqlite:////tmp/malenge_migration_test.db
        run: |
          rm -f /tmp/malenge_migration_test.db
          python -m flask --app app db upgrade
          python -m flask --app app db current

  regression:
    name: Regression / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full_regression_tests.py
          - permission_regression_tests.py
          - mobile_regression_tests.py
          - security_regression_tests.py
          - executive_regression_tests.py
          - membership_regression_tests.py
          - phase6_accountability_tests.py
          - phase7_regression_tests.py
          - secondary_scope_regression_tests.py
          - primary_production_regression_tests.py
          - joint_operations_regression_tests.py
          - actionable_options_regression_tests.py
          - ledger_regression_tests.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ${{ matrix.suite }}
        env:
          SECRET_KEY: github-actions-regression-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
        run: python ${{ matrix.suite }}
