name: CRM Regression Suite

on:
  push:
    branches:
      - main
      - crm-hardening-2026-09
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify migrations build a fresh database
        env:
          SECRET_KEY: github-actions-migration-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
          DATABASE_URL: sqlite:////tmp/malenge_migration_test.db
        run: |
          rm -f /tmp/malenge_migration_test.db
          python -m flask --app app db upgrade
          python -m flask --app app db current
      - name: Run complete CRM regression suite
        env:
          SECRET_KEY: github-actions-regression-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
        run: python run_regression_tests.py
