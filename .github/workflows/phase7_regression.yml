name: CRM Regression Suite

on:
  push:
    branches:
      - main
      - crm-hardening-2026-09
      - crm-hardening-2-integrity
      - crm-hardening-3-reconciliation
      - crm-hardening-4-finance-unification
      - crm-hardening-5-opening-balance-integrity
      - crm-hardening-6-transaction-context
      - crm-hardening-7-ledger-corrections
      - crm-hardening-8-confirmed-reversals
      - crm-hardening-9-finance-source-of-truth
      - crm-hardening-10-auth-lifecycle
      - crm-hardening-11-database-integrity
      - crm-hardening-12-error-feedback
      - crm-hardening-13-security-controls
      - crm-hardening-14-operational-readiness
      - crm-hardening-15-backup-recovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Migration integrity / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build a fresh database from migrations
        env:
          SECRET_KEY: github-actions-migration-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
          DATABASE_URL: sqlite:////tmp/malenge_migration_test.db
        run: |
          rm -f /tmp/malenge_migration_test.db
          python -m flask --app app db upgrade
          python -m flask --app app db current

  postgres-migration:
    name: Migration integrity / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: malenge_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d malenge_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build a fresh PostgreSQL database from migrations
        env:
          SECRET_KEY: github-actions-postgres-migration-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/malenge_ci
        run: |
          python -m flask --app app db upgrade
          python -m flask --app app db current

  regression:
    name: Regression / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full_regression_tests.py
          - permission_regression_tests.py
          - mobile_regression_tests.py
          - security_regression_tests.py
          - executive_regression_tests.py
          - membership_regression_tests.py
          - phase6_accountability_tests.py
          - phase7_regression_tests.py
          - secondary_scope_regression_tests.py
          - primary_production_regression_tests.py
          - joint_operations_regression_tests.py
          - actionable_options_regression_tests.py
          - ledger_regression_tests.py
          - ledger_reversal_regression_tests.py
          - finance_control_source_truth_tests.py
          - auth_hardening_regression_tests.py
          - database_integrity_regression_tests.py
          - error_feedback_regression_tests.py
          - operational_readiness_regression_tests.py
          - backup_recovery_regression_tests.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ${{ matrix.suite }}
        env:
          SECRET_KEY: github-actions-regression-secret
          APP_ENV: testing
          TWO_FACTOR_REQUIRED: 'false'
        run: python ${{ matrix.suite }}
