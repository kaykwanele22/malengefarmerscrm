{% extends "base.html" %}
{% block title %}Set Your Password | Malenge Farmers CRM{% endblock %}
{% block content %}
<div style="max-width:760px;margin:32px auto;padding:0 18px">
  <section style="background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:28px;box-shadow:0 10px 28px rgba(18,63,41,.07)">
    <div style="display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff4d8;color:#7a5a08;font-size:12px;font-weight:800;margin-bottom:12px">ACCOUNT SECURITY</div>
    <h1 style="margin:0 0 10px;color:#173b2b">Choose your own password</h1>
    <p style="color:#5f6f65;line-height:1.6">Your account is using a temporary or Admin-reset password. Replace it before continuing into the CRM.</p>
    <form method="POST" action="{{ url_for('authsec.change_required_password') }}" style="display:grid;gap:16px;margin-top:24px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label style="display:grid;gap:6px"><strong>Current temporary password</strong><input type="password" name="current_password" autocomplete="current-password" required style="min-height:44px;padding:10px;border:1px solid #cad8cf;border-radius:8px"></label>
      <label style="display:grid;gap:6px"><strong>New password</strong><input type="password" name="new_password" autocomplete="new-password" minlength="{{ minimum_length }}" required style="min-height:44px;padding:10px;border:1px solid #cad8cf;border-radius:8px"><small style="color:#66766d">At least {{ minimum_length }} characters with uppercase, lowercase, a number and a symbol.</small></label>
      <label style="display:grid;gap:6px"><strong>Confirm new password</strong><input type="password" name="confirm_password" autocomplete="new-password" minlength="{{ minimum_length }}" required style="min-height:44px;padding:10px;border:1px solid #cad8cf;border-radius:8px"></label>
      <div><button type="submit" style="min-height:44px;border:0;border-radius:9px;background:#2e8251;color:#fff;padding:0 18px;font-weight:800;cursor:pointer">Save Password &amp; Continue</button></div>
    </form>
  </section>
</div>
{% endblock %}
