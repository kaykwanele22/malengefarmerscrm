<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} | Malenge Farmers CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body>
    <main class="error-shell" aria-labelledby="error-title">
        <section class="error-card">
            <div class="error-code">ERROR {{ status_code }}</div>
            <h1 id="error-title">{{ title }}</h1>
            <p class="error-message">{{ message }}</p>

            {% if request_id %}
            <div class="error-reference" role="note">
                <span>Reference</span>
                <code>{{ request_id }}</code>
                <small>Share this reference with the CRM administrator if you need support.</small>
            </div>
            {% endif %}

            <div class="error-actions">
                <button type="button" onclick="history.back()">Go Back</button>
                <a href="{{ destination }}">{{ destination_label }}</a>
            </div>
        </section>
    </main>
</body>
</html>
